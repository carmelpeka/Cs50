{% load static %}
<html lang="en">
    <head>
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="{% static 'encyclopedia/style1.css' %}" rel="stylesheet">
    </head>
    <body>
      <div class="row">
  <!-- Sidebar : moitié de l'écran grâce à Bootstrap -->
        <div class="sidebar col-lg-6 col-md-6" >
              <form action="{% url 'modify' title %}" method="POST" class="form">
                  {% csrf_token %}
      <!-- Inputs : moitié de la sidebar -->

                <input type="text" class="form-control " placeholder="Title" id="t1" name="title" value="{{title}}">
                <textarea class="form-control" placeholder="Content" id="t2" name="content">{{markdown}}</textarea>
                <button class="btn btn-primary" type="submit">modify</button>
              </form>
        </div>

        <div class="col-lg-6 col-md-6" >

        </div>
      </div>


    </body>
</html>
