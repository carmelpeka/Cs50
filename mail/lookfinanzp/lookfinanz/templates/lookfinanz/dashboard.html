{% extends "lookfinanz/layout.html" %}
{% load static %}
{% block body %}

<div id="dashboard">
    <div class="row" id="dashboard_fernster">
         <div class="sidebar col-lg-2 col-md-3">
             <form >
                 <div class="form-group">

                   <p>{{ form.begin.label_tag }}<br>{{ form.begin }}</p>
                   <p>{{ form.end.label_tag }}<br>{{ form.end }}</p>
                </div>

                 <div class="form-group">
                        <label >period</label>
                        <select class="form-control" id="id_period">
                            <option value="day" >Day</option>
                            <option value="month" >Month</option>
                            <option value="year" >Year</option>
                        </select>
                  </div>
                 <button type="button" id="plot_button">plot</button>
             </form>

         </div>
        <div class="main col-lg-10 col-md-9" id="transaction_select_filter_oder_all">
            <div style="width: 80%; max-width: 800px; margin: auto;">
                <canvas id="myChart1" width="400" height="200"></canvas>
                <canvas id="myChart2" width="400" height="200"></canvas>
                <canvas id="myChart3" width="400" height="200"></canvas>
            </div>

        </div>

    </div>
</div>


{% endblock %}
